<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toad Trip</title>

    <!-- normalize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.0/normalize.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- JavaScript -->
    <script src="script.js" defer></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

</head>

<body>

    <header>
        <h1>Toad Trip</h1>
        <p>photosensitive epilepsy warning</p>
        <a href="#section1">ENTER</a>
    </header>

    <main>
        <figure class="photo1">
            <div class="container">

                <img src="images/frog_sleep.jpg" width="900" height="1600" alt="the frog laying down on bench">


                <img class="layer sleep2" src="images/frog_sleep_2.jpg" width="900" height="1600"
                    alt="the frog laying down on bench">
                <img class="layer close" src="images/frog_sleep_close.jpg" width="900" height="1600"
                    alt="close up of frog laying on bench">
                <img class="layer dark" src="images/frog_sleep_dark.jpg" width="900" height="1600"
                    alt="frog laying on bench, dark">
                <img class="layer bright" src="images/frog_bright.jpg" width="1200" height="1600"
                    alt="the frog walking toward the camera in a flashlight beam">
                <img class="layer stand" src="images/frog_come_close.jpg" width="1200" height="1600"
                    alt="the frog standing up, facing the camera">

                <img class="layer down" src="images/frog_downview.jpg" width="1600" height="1200"
                    alt="frog looking over the camera">

                <div class="slider animate">
                    <div class="a">
                        <div class="film red"></div>
                        <div class="lens gray"></div>
                        <div class="film yellow"></div>
                        <div class="lens shift"></div>
                        <div class="film green"></div>
                        <div class="lens sepia"></div>
                        <div class="film blue"></div>
                        <div class="lens blur"></div>
                        <div class="film magenta"></div>
                        <div class="lens saturate"></div>
                        <div class="film orange"></div>
                    </div>

                    <div class="b">
                        <div class="film red"></div>
                        <div class="lens gray"></div>
                        <div class="film yellow"></div>
                        <div class="lens shift"></div>
                        <div class="film green"></div>
                        <div class="lens sepia"></div>
                        <div class="film blue"></div>
                        <div class="lens blur"></div>
                        <div class="film magenta"></div>
                        <div class="lens saturate"></div>
                        <div class="film orange"></div>
                    </div>
                </div>

            </div>

        </figure>
        <section id="section1">
            <h2>lie down. it's okay.</h2>
        </section>
        <section id="section2">
            <h2>breathe in... and out...</h2>
        </section>
        <section id="section3">
            <h2>can you feel the colors moving?</h2>
        </section>
        <section id="section4">
            <h2>don't fight it</h2>
        </section>
        <section id="section5">
            <h2>isn't this feeling wonderful?</h2>
        </section>
        <section id="section6">
            <h2>come here. it's okay </h2>
        </section>
        <section id="section7">
            <h2>now you are one of us</h2>
        </section>
    </main>
</body>

</html>
