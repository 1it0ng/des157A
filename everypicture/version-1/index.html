<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Blink</title>

    <!-- normalize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.0/normalize.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- JavaScript -->
    <script src="script.js" defer></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

</head>

<body>

    <header>
        <h1>Don't Blink</h1>
        <a href="#section1">ENTER</a>
    </header>

    <main>
        <figure class="photo1">
            <div class="container">

                <img src="images/frog_sleep.avif" width="900" height="1600" alt="the frog laying down on bench">


                <img class="layer sleep2" src="images/frog_sleep_2.avif" width="900" height="1600"
                    alt="the frog laying down on bench">
                <img class="layer close" src="images/frog_sleep_close.avif" width="900" height="1600"
                    alt="close up of frog laying on bench">
                <img class="layer dark" src="images/frog_sleep_dark.avif" width="900" height="1600"
                    alt="frog laying on bench, dark">
                <img class="layer bright" src="images/frog_bright.avif" width="1200" height="1600"
                    alt="the frog walking toward the camera in a flashlight beam">
                <img class="layer stand" src="images/frog_come_close.avif" width="1200" height="1600"
                    alt="the frog standing up, facing the camera">
                <div class="a">
                    <div class="film red"></div>
                    <div class="lens gray"></div>
                    <div class="film yellow"></div>
                    <div class="lens shift"></div>
                    <div class="film green"></div>
                    <div class="lens sepia"></div>
                    <div class="film blue"></div>
                    <div class="lens blur"></div>
                    <div class="film magenta"></div>
                    <div class="lens saturate"></div>
                    <div class="film orange"></div>
                </div>

                <div class="b">
                    <div class="film red"></div>
                    <div class="lens gray"></div>
                    <div class="film yellow"></div>
                    <div class="lens shift"></div>
                    <div class="film green"></div>
                    <div class="lens sepia"></div>
                    <div class="film blue"></div>
                    <div class="lens blur"></div>
                    <div class="film magenta"></div>
                    <div class="lens saturate"></div>
                    <div class="film orange"></div>
                </div>
            </div>

            <div class="flashlight"></div>
        </figure>
        <section id="section1">
            <h2>1</h2>
        </section>
        <section id="section2">
            <h2>2</h2>
        </section>
        <section id="section3">
            <h2>3</h2>
        </section>
        <section id="section4">
            <h2>4</h2>
        </section>
        <section id="section5">
            <h2>5</h2>
        </section>
        <section id="section6">
            <h2>6</h2>
        </section>
    </main>

    <footer>
        <h2>7</h2>

        <img src="images/frog_downview.jpg" width="1600" height="1200" alt="a frog angled from below">
    </footer>

</body>

</html>
