<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frog</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <!-- Script -->
    <script src="script.js" defer></script>

</head>

<body>
    <div class="container">
        <img src="images/frog.jpg" alt="frog">
        <div class="slider">
            <div class="a">
                <div class="film red"></div>
                <div class="lens gray"></div>
                <div class="film yellow"></div>
                <div class="lens invert"></div>
                <div class="film green"></div>
                <div class="lens sepia"></div>
                <div class="film blue"></div>
                <div class="lens blur"></div>
                <div class="film magenta"></div>
                <div class="lens saturate"></div>
                <div class="film orange"></div>
            </div>
        </div>
    </div>
    <div class="controls">
        <button id="pauseButton">Pause</button>
        <button id="trip">Trippiness: 1</button>
    </div>

</body>

</html>
